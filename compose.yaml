x-env: &env
  FRAUD_HOME: /app
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:29092
  DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud

x-app: &app
  image: frauddetect:local
  environment: *env
  volumes:
    - ./artifacts:/app/artifacts:ro
    - ./data:/app/data:ro

services:
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Local development only. Nothing here is exposed beyond this machine.
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 3s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *app
    # Only this service builds the serving image. The others reuse it, because
    # parallel builds of one image tag fail.
    build:
      context: .
      target: base
    command: ["python", "-m", "frauddetect.stream", "bootstrap"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "frauddetect.service:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--log-level", "warning"]
    environment:
      <<: *env
      # Four API processes share one metrics page through files in this folder.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on: &ready
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "frauddetect.stream", "worker"]
    restart: unless-stopped
    deploy:
      replicas: 4 # one per Kafka partition; more would sit idle
    depends_on: *ready

  sink:
    <<: *app
    command: ["python", "-m", "frauddetect.stream", "sink"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  producer:
    <<: *app
    profiles: ["load"]
    command: ["python", "-m", "frauddetect.stream", "produce", "--n", "20000", "--rate", "500"]
    depends_on:
      kafka:
        condition: service_healthy

  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]
    command: ["run", "/scripts/score.js"]
    environment:
      API_URL: http://api:8000/v1/score
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

  # Training and retraining. It writes model files, so unlike the services it
  # mounts artifacts and data read-write. Run it with `docker compose run --rm ops ...`.
  ops:
    image: frauddetect:ops
    profiles: ["ops"]
    build:
      context: .
      target: ops
    command: ["python", "-m", "frauddetect.train"]
    environment:
      GIT_PYTHON_REFRESH: quiet # MLflow looks for git, which this image does not have
      FRAUD_HOME: /app
      MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - mlflow-data:/mlflow

  # Dashboards. Open http://localhost:3001
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Local development only: anyone who can reach this port is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres

  # Orchestration. Open http://localhost:3000
  dagster:
    image: frauddetect:ops
    profiles: ["orchestration"]
    restart: unless-stopped
    command: ["dagster", "dev", "-m", "frauddetect.orchestration", "-h", "0.0.0.0", "-p", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FRAUD_HOME: /app
      MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      DAGSTER_HOME: /dagster
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - mlflow-data:/mlflow
      - dagster-data:/dagster
    depends_on:
      postgres:
        condition: service_healthy

  # Streaming SQL over the decisions topic. Flink's web page is http://localhost:8081
  flink-jobmanager:
    image: frauddetect-flink:local
    profiles: ["flink"]
    build: ./flink
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m

  flink-taskmanager:
    image: frauddetect-flink:local
    profiles: ["flink"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager

  # Submits the SQL job and exits. The job keeps running inside the cluster.
  flink-submit:
    image: frauddetect-flink:local
    profiles: ["flink"]
    # The image only applies FLINK_PROPERTIES to the cluster processes, so the
    # SQL client is told where the cluster is on its command line.
    command:
      - bin/sql-client.sh
      - embedded
      - -Drest.address=flink-jobmanager
      - -Drest.port=8081
      - -f
      - /sql/decision_stats.sql
    volumes:
      - ./flink/sql:/sql:ro
    depends_on:
      - flink-jobmanager
      - flink-taskmanager

volumes:
  redis-data:
  postgres-data:
  mlflow-data:
  dagster-data:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frauddetect"
version = "0.1.0"
description = "Real-time card fraud detection system, built to run entirely on free local tools"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "redis>=5.0",
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.4",
    "xgboost>=2.1",
    "optuna>=3.6",
    "mlflow>=2.14",
    "onnx>=1.16",
    "onnxmltools>=1.12",
]
ops = ["dagster>=1.9", "dagster-webserver>=1.9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
